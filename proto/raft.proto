syntax = "proto3";

package raft;

option go_package = "raftkv/internal/raftpb";

// RaftService defines the two RPCs from Figure 2 of the Raft paper.
// RequestVote is used by candidates to gather votes during elections (§5.2).
// AppendEntries is used by the leader for log replication and heartbeats (§5.3).
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// RequestVoteRequest — Figure 2: RequestVote RPC arguments.
// Sent by candidates to all peers when starting an election.
message RequestVoteRequest {
  int64 term           = 1; // candidate's term
  int64 candidate_id   = 2; // candidate requesting vote
  int64 last_log_index = 3; // index of candidate's last log entry (§5.4.1)
  int64 last_log_term  = 4; // term of candidate's last log entry (§5.4.1)
}

// RequestVoteResponse — Figure 2: RequestVote RPC results.
message RequestVoteResponse {
  int64 term         = 1; // currentTerm, for candidate to update itself
  bool  vote_granted = 2; // true means candidate received vote
}

// LogEntry — a single entry in the replicated log (§5.3).
// Used inside AppendEntriesRequest. For Phase 3 (heartbeats only), the
// entries field will always be empty — full replication is Phase 4.
message LogEntry {
  int64 term    = 1; // term when entry was received by leader
  int64 index   = 2; // position in the log (1-indexed per paper convention)
  bytes command = 3; // opaque command for the state machine
}

// AppendEntriesRequest — Figure 2: AppendEntries RPC arguments.
// Used for both heartbeats (empty entries) and log replication (Phase 4).
message AppendEntriesRequest {
  int64            term           = 1; // leader's term
  int64            leader_id      = 2; // so follower can redirect clients
  int64            prev_log_index = 3; // index of log entry immediately preceding new ones
  int64            prev_log_term  = 4; // term of prevLogIndex entry
  repeated LogEntry entries       = 5; // log entries to store (empty for heartbeat)
  int64            leader_commit  = 6; // leader's commitIndex
}

// AppendEntriesResponse — Figure 2: AppendEntries RPC results.
message AppendEntriesResponse {
  int64 term    = 1; // currentTerm, for leader to update itself
  bool  success = 2; // true if follower contained entry matching prevLogIndex and prevLogTerm
}
